[project]
name = "pytool"
version = "0.1.0"
description = "개인 공부용 프로젝트 — FastAPI + Claude API 도구 호출 데모 및 Pandas 학습"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "EumGrowth" },
]
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn>=0.47.0",
    "anthropic>=0.60.0",
    "pandas>=3.0.3",
    "openpyxl>=3.1.5",
    "pyarrow>=24.0.0",
    "tabulate>=0.10.0",
    "sentence-transformers>=4.0",
    "scikit-learn>=1.8.0",
    "requests>=2.34.2",
    "openai>=2.37.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
markers = [
    "slow: integration tests that require model download or heavy computation",
]
